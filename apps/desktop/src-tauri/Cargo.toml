[package]
name = "cyberhack"
version = "0.6.2"
description = "CyberHack — roguelike-deckbuilder"
authors = ["promtly-ru"]
edition = "2021"

[lib]
name = "cyberhack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
