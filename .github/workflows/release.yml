name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (создастся на текущем коммите, если его нет)'
        required: true
        default: 'v0.1.0'
      targets:
        description: 'Что собирать'
        type: choice
        options: [all, desktop, android]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Создать релиз
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "CyberHack $TAG" \
              --notes "Сборки CyberHack $TAG: Windows (.msi/.exe), macOS (.dmg, Apple Silicon), Linux (.AppImage/.deb), Android (.apk). Сборки не подписаны — см. раздел «Скачать» в README."
          fi
          echo "id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'android'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri --
          releaseId: ${{ needs.release.outputs.id }}

  android:
    name: Android (APK)
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'desktop'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # дефолтный пакет 'tools' удалён из sdkmanager — задаём явно
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - run: npm ci

      - name: Сборка web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Capacitor sync
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Версия
        run: |
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/CyberHack-$TAG-android-debug.apk"

      - name: Release APK (подпись из secrets)
        if: env.KEYSTORE_B64 != ''
        working-directory: apps/mobile/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/out/CyberHack-$TAG-android.apk" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" out/*.apk --clobber
